[workspace]
resolver = "2"
members = ["crates/qaly-mcp", "crates/qaly", "crates/qaly-test"]

[workspace.package]
edition = "2021"
version = "0.3.1"
license = "MIT"
repository = "https://github.com/qaly-dev/qaly"
homepage = "https://qaly.dev"
description = "MCP-first Android testing tool for AI agents"

[workspace.dependencies]
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
dirs        = "5"
tempfile    = "3"
walkdir     = "2"
indicatif   = "0.17"
dialoguer   = { version = "0.11", default-features = false, features = ["password"] }
tonic       = { version = "0.12", features = ["transport"] }
prost       = "0.13"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
which       = "4"
rmcp        = { version = "0.12", features = ["server", "transport-io", "macros"] }
schemars    = "1"
base64      = "0.22"

[profile.dist]
inherits = "release"
lto = "thin"
