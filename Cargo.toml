[workspace]
resolver = "2"
members = ["crates/qaly-mcp", "crates/qaly", "crates/qaly-test"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/qaly-dev/qaly"
homepage = "https://qaly.dev"
description = "MCP-first Android testing tool for AI agents"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
roxmltree = "0.20"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
rmcp = { version = "0.12", features = ["server", "transport-io", "macros"] }
schemars = "1"
anyhow = "1"
tempfile = "3"
toml = "0.8"
dirs = "5"
walkdir = "2"
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[profile.dist]
inherits = "release"
lto = "thin"
