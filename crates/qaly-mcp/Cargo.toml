[package]
name = "qaly-mcp"
edition = "2021"
version.workspace = true
license = "MIT"
repository = "https://github.com/qaly-dev/qaly"
homepage = "https://qaly.dev"
description = "MCP-first Android testing tool for AI agents (gRPC client to qaly-daemon)"

[[bin]]
name = "qaly-mcp"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rmcp        = { version = "0.12", features = ["server", "transport-io", "macros"] }
schemars    = "1"
base64      = "0.22"
anyhow      = "1"
tonic       = { version = "0.12", features = ["transport"] }
prost       = "0.13"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
which       = "4"

[build-dependencies]
tonic-build = "0.12"
