[package]
name = "qaly"
edition = "2021"
version = "0.3.1-alpha.2"
license = "MIT"
repository = "https://github.com/qaly-dev/qaly"
homepage = "https://qaly.dev"
description = "MCP-first Android testing tool for AI agents"

[[bin]]
name = "qaly"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
dirs        = "5"
tempfile    = "3"
indicatif   = "0.17"
dialoguer   = { version = "0.11", default-features = false, features = ["password"] }
tonic       = { version = "0.12", features = ["transport"] }
prost       = "0.13"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
which       = "4"

[build-dependencies]
tonic-build = "0.12"
